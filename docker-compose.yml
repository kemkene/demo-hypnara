services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hypnara
      POSTGRES_PASSWORD: hypnara
      POSTGRES_DB: hypnara
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypnara -d hypnara"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://hypnara:hypnara@db:5432/hypnara
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
